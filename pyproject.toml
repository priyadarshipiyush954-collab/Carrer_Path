[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-explorer"
version = "1.0.0"
description = "Python and Web Explorer for Technology Career Paths and In-Demand Skills"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Hackathon Team", email = "priyadarshipiyush954@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
job-market = "python_app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
